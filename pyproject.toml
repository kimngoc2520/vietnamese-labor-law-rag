[project]
name = "vietnamese-labor-law-rag"
version = "0.1.0"
description = "Evaluation-driven RAG system for Vietnamese labor law with adaptive retrieval and reranking"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pgvector>=0.3",
    "python-dotenv>=1.0",
    "pypdf>=5.0",
    "pyyaml>=6.0",
    "pymupdf>=1.24",
    "pytesseract>=0.3.13",
    "pillow>=10.0",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers==3.4.1",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100