[project]
name = "vietnamese-labor-law-rag"
version = "0.1.0"
description = "Evaluation-driven RAG system for Vietnamese labor law with adaptive retrieval and reranking"
requires-python = ">=3.11"

dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",

    # Configuration
    "python-dotenv>=1.0",
    "pyyaml>=6.0",

    # Database
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pgvector>=0.3",

    # Document processing
    "pypdf>=5.0",
    "pymupdf>=1.24",
    "pytesseract>=0.3.13",
    "pillow>=10.0",

    # Retrieval
    "rank-bm25>=0.2.2",
    "sentence-transformers==3.4.1",

    # LLM
    "openai>=1.0",
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]